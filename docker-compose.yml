services:
  postgres:
    image: postgres:17-alpine
    container_name: tutor-hub-postgres
    environment:
      POSTGRES_DB: TuitionPlatformDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - tutor_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TuitionPlatformDb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tutor_hub_postgres_data:
