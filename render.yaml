services:
  - type: web
    name: tutor-hub-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: tutor-hub-db
          property: connectionString
      - key: Jwt__Issuer
        value: TuitionPlatform
      - key: Jwt__Audience
        value: TuitionPlatform
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__ExpiryMinutes
        value: 60
      - key: Jwt__RefreshTokenDays
        value: 30

databases:
  - name: tutor-hub-db
    databaseName: tutor_hub
    user: tutor_hub
    plan: free
